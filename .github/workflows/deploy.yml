name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Inject API keys from GitHub Secrets into config.js ──────────
      - name: Inject secrets into config.js
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sed -i "s|YOUR_GOOGLE_MAPS_API_KEY|${GOOGLE_MAPS_API_KEY}|g" js/config.js
          sed -i "s|YOUR_SUPABASE_URL|${SUPABASE_URL}|g"               js/config.js
          sed -i "s|YOUR_SUPABASE_ANON_KEY|${SUPABASE_ANON_KEY}|g"     js/config.js
          sed -i "s|YOUR_GOOGLE_MAPS_API_KEY|${GOOGLE_MAPS_API_KEY}|g" game.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # deploy the whole repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
