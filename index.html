<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoRival — Free Multiplayer GeoGuessr</title>
  <meta name="description" content="Play a free GeoGuessr-style geography game with friends. No account needed." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       HOME SCREEN
  ═══════════════════════════════════════════ -->
  <div id="screen-home" class="screen center-screen">
    <div class="logo-wrap">
      <span class="logo-icon">🌍</span>
      <h1 class="logo-text">GeoRival</h1>
      <p class="logo-sub">Drop a pin. Beat your friends.</p>
    </div>
    <div class="btn-group">
      <button id="btn-host" class="btn btn-primary">Host a Game</button>
      <button id="btn-join" class="btn btn-secondary">Join with Code</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       HOST SETUP SCREEN
  ═══════════════════════════════════════════ -->
  <div id="screen-host" class="screen center-screen hidden">
    <div class="card">
      <h2>Create a Game</h2>

      <label class="field-label" for="host-name">Your Name</label>
      <input id="host-name" class="field-input" type="text" maxlength="20" placeholder="e.g. Alex" autocomplete="off" />

      <div class="settings-grid">
        <div>
          <label class="field-label" for="setting-round-time">Round Timer (seconds)</label>
          <input id="setting-round-time" class="field-input" type="number" value="60" min="0" max="600" data-round-count="5" />
          <small class="field-hint">Set 0 for no timer</small>
        </div>
        <div>
          <label class="field-label" for="setting-max-players">Max Players</label>
          <select id="setting-max-players" class="field-input field-select">
            <option value="2">2 players</option>
            <option value="3" selected>3 players</option>
          </select>
        </div>
      </div>

      <button id="btn-create-game" class="btn btn-primary w-full">Create Game</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       JOIN SCREEN
  ═══════════════════════════════════════════ -->
  <div id="screen-join" class="screen center-screen hidden">
    <div class="card">
      <h2>Join a Game</h2>

      <label class="field-label" for="join-name">Your Name</label>
      <input id="join-name" class="field-input" type="text" maxlength="20" placeholder="e.g. Sam" autocomplete="off" />

      <label class="field-label" for="join-code">Room Code</label>
      <input id="join-code" class="field-input field-code" type="text" maxlength="4" placeholder="XXXX" autocomplete="off" />

      <p id="join-error" class="error-text"></p>
      <button id="btn-join-game" class="btn btn-primary w-full">Join Game</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       LOBBY SCREEN
  ═══════════════════════════════════════════ -->
  <div id="screen-lobby" class="screen center-screen hidden">
    <div class="card card-wide">
      <div class="lobby-header">
        <h2>Waiting for Players</h2>
        <div class="room-code-display">
          <span class="room-code-label">Room Code</span>
          <span id="lobby-code" class="room-code-value">----</span>
        </div>
      </div>

      <p id="lobby-settings" class="lobby-settings-text"></p>

      <ul id="player-list" class="player-list"></ul>

      <p id="lobby-status" class="lobby-status-msg">Share the room code with your friend to start!</p>

      <button id="btn-ready" class="btn btn-primary w-full">I'm Ready!</button>
    </div>
  </div>

  <script type="module" src="js/lobby.js"></script>
</body>
</html>
