<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoKnowr — Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="game-body">

  <!-- ═══════════════════════════════════════
       HUD (top bar)
  ═══════════════════════════════════════ -->
  <header class="game-hud">
    <div class="hud-left">
      <img src="assets/logo.png" alt="GeoKnowr" class="hud-logo" />
      <div class="hud-round-wrap">
        <span id="round-label" class="hud-round">Round 1 / 5</span>
        <div id="round-dots" class="round-dots"></div>
      </div>
    </div>
    <div class="hud-center">
      <span id="timer-display" class="hud-timer">60</span>
    </div>
    <div class="hud-right">
      <span class="hud-score-label">Score</span>
      <strong id="total-score" class="hud-score-value">0</strong>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       MAIN GAME AREA
  ═══════════════════════════════════════ -->
  <div id="game-area">
    <div id="panorama"></div>

    <!-- Compass (top-left, above panorama) -->
    <div class="compass" id="compass" title="Heading">
      <div class="compass-ring">
        <span class="compass-cardinal n">N</span>
        <span class="compass-cardinal e">E</span>
        <span class="compass-cardinal s">S</span>
        <span class="compass-cardinal w">W</span>
        <div class="compass-needle" id="compass-needle"></div>
        <div class="compass-center"></div>
      </div>
      <span class="compass-heading" id="compass-heading">0°</span>
    </div>

    <!-- Guess map overlay (bottom-right) -->
    <div class="guess-map-container" id="guess-map-container">
      <div class="guess-map-header">
        <span class="guess-map-hint">Click map to place pin</span>
        <button id="btn-expand-map" class="btn-icon" title="Expand map">⛶</button>
      </div>
      <div id="guess-map"></div>
      <div class="guess-map-footer">
        <p id="waiting-msg" class="waiting-msg hidden">⏳ 0 / 0 players guessed</p>
        <button id="btn-guess" class="btn btn-guess" disabled>Guess!</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       ROUND RESULTS PANEL
  ═══════════════════════════════════════ -->
  <div id="results-panel" class="overlay-panel hidden">
    <div class="panel-inner">
      <div class="panel-header">
        <img src="assets/logo.png" alt="" class="panel-logo" />
        <h2 class="panel-title">Round Results</h2>
      </div>
      <div id="results-map" class="results-map"></div>
      <table class="results-table">
        <thead>
          <tr><th>#</th><th>Player</th><th>Distance</th><th>Points</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button id="btn-next-round" class="btn btn-primary w-full">Next Round</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       FINAL LEADERBOARD
  ═══════════════════════════════════════ -->
  <div id="final-panel" class="overlay-panel hidden">
    <div class="panel-inner">
      <div class="panel-header">
        <img src="assets/logo.png" alt="" class="panel-logo" />
        <h2 class="panel-title">Final Results</h2>
      </div>
      <table class="results-table results-table--final">
        <thead>
          <tr><th>Rank</th><th>Player</th><th>Total Score</th></tr>
        </thead>
        <tbody id="final-body"></tbody>
      </table>
      <a href="index.html" class="btn btn-primary w-full" style="margin-top:1rem;display:block;text-align:center;text-decoration:none;">Play Again</a>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
